---

# Dotfiles
chezmoi_repo: "https://github.com/Phill93/dotfiles_new.git"

# Dock
dockitems_remove:
  - Karten
  - Fotos
  - FaceTime
  - Erinnerungen
  - Notizen
  - TV
  - Musik
  - Podcasts
  - Keynote
  - Numbers
  - Pages
  - AppStore

dockitems_persist:
  - name: "Visual Studio Code"
    path: "/Applications/Visual Studio Code.app/"
  - name: "iTerm"
    path: "/Applications/iTerm.app/"
  - name: "Spotify"
    path: "/Applications/Spotify.app/"
  - name: "Obisidian"
    path:  "/Applications/Obsidian.app"

# GPG
gpg_public_keys:
  - mail@phill93.de
