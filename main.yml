---
- name: Configure MacOs
  hosts: all
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/local/bin/:/opt/homebrew/bin"
  roles:
    - role: elliotweiser.osx-command-line-tools
    - role: geerlingguy.mac.homebrew
      tags:
        - homebrew
        - software
    - role: geerlingguy.mac.mas
      tags:
        - mas
        - software
    - role: geerlingguy.mac.dock
      tags:
        - dock
        - adjustments
  tasks:
    - name: Init chezmoi # noqa no-changed-when
      ansible.builtin.command:
        cmd: "chezmoi init --apply {{ chezmoi_repo }}"
      become: false
      tags:
        - dotfiles
        - adjustments

    - name: Import gpg public keys
      ansible.builtin.command: "gpg --auto-key-locate keyserver --locate-keys {{ item }}"
      with_items: "{{ gpg_public_keys }}"
      register: gpg_import
      changed_when: "'imported' in gpg_import.stderr"
      become: false
      tags:
        - gpg
        - adjustments

    - name: Update gpg public keys
      ansible.builtin.command: "gpg --refresh"
      register: gpg_sync
      changed_when: "'new signatures' in gpg_sync.stderr"
      become: false
      tags:
        - gpg
        - adjustments

    - name: Install Vundle
      ansible.builtin.git:
        repo: 'https://github.com/VundleVim/Vundle.vim.git'
        dest: /Users/{{ ansible_user_id }}/.vim/bundle/Vundle.vim
        version: master
      become: false
      register: vundle_git
      tags:
        - vim
        - adjustments

    - name: Run Vundle Install # noqa no-changed-when
      ansible.builtin.command: "vim +PluginInstall +qall"
      become: false
      tags:
        - vim
        - adjustments
  pre_tasks:

    - name: Install Rosetta 2 # noqa no-changed-when
      ansible.builtin.command: "softwareupdate --install-rosetta --agree-to-license"
      when: "'arm64' in ansible_machine"
      tags:
        - rosetta
        - software
